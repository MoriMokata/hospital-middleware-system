services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - internal
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      PORT: "8080"
      DB_DSN: "postgres://postgres:postgres@postgres:5432/hospital_middleware?sslmode=disable"
      JWT_SECRET: "changeme-in-production"
      HOSPITAL_A_BASE_URL: "https://hospital-a.api.co.th"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_middleware
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

networks:
  internal:

volumes:
  pgdata:
